# Packaging configuration used by the manually dispatched release workflow.
# During 1.0.0 packaging, the app source comes from the pre-existing tag,
# while this configuration is checked out from the reviewed release tooling.
appId: com.researchos.app
productName: ResearchOS
copyright: Copyright © 2026 hk9992221

asar: true
electronVersion: 45.3.4
npmRebuild: true
publish: null

directories:
  app: packages/desktop
  output: release
  buildResources: resources

files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/sqlite-vec/**'
  - '**/node_modules/sqlite-vec-*/**'
  - '**/node_modules/@napi-rs/keyring/**'
  - '**/*.node'

extraResources:
  - from: resources/appicon.png
    to: appicon.png
  - from: LICENSE
    to: legal/LICENSE.txt
  - from: NOTICE
    to: legal/NOTICE.txt
  - from: THIRD-PARTY-NOTICES.md
    to: legal/THIRD-PARTY-NOTICES.md
  - from: licenses
    to: legal/licenses

win:
  icon: resources/appicon.png
  target:
    - nsis
    - portable

nsis:
  artifactName: ResearchOS-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ResearchOS-${version}-win-${arch}-portable.${ext}

mac:
  icon: resources/appicon.png
  category: public.app-category.productivity
  artifactName: ResearchOS-${version}-mac-${arch}.${ext}
  # Local/ad-hoc signature, NOT Apple Developer ID signing or notarization.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target:
    - dmg
    - zip

linux:
  executableName: researchos
  maintainer: "hk9992221 <152012650+hk9992221@users.noreply.github.com>"
  icon: resources/appicon.png
  category: Science
  artifactName: ResearchOS-${version}-linux-${arch}.${ext}
  target:
    - deb
    - rpm
    - AppImage
